name: Build macOS

on:
  push:
    tags:
      - "v*"
    branches:
      - mac-port
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install portaudio (brew)
        run: brew install portaudio

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements/macos.txt

      - name: Build VoiceFlow.app
        run: bash packaging/macos/build.sh

      - name: Smoke test (import voiceflow modules, offscreen Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          python -c "
          import voiceflow.platform as p
          assert p.IS_MAC, 'IS_MAC should be True on a macOS runner'
          import voiceflow.app  # noqa: F401 - import-time wiring only, no QApplication started
          print('OK: voiceflow modules import cleanly on macOS (IS_MAC=%s)' % p.IS_MAC)
          "

      - name: Verify bundle (arch, binary present)
        run: |
          set -euo pipefail
          APP="dist/macos/VoiceFlow.app"
          BIN="$APP/Contents/MacOS/VoiceFlow"
          test -d "$APP" || { echo "BLAD: brak $APP"; exit 1; }
          test -f "$BIN" || { echo "BLAD: brak binarki $BIN"; exit 1; }
          file "$BIN"
          file "$BIN" | grep -q "arm64" || { echo "BLAD: binarka $BIN nie jest arm64"; exit 1; }
          otool -L "$BIN" | head -20
          echo "OK: bundle wyglada poprawnie (arm64, binarka obecna)."

      - name: Launch test (built app)
        run: |
          set -euo pipefail
          APP="dist/macos/VoiceFlow.app"
          BIN="$APP/Contents/MacOS/VoiceFlow"

          # Swiezy $HOME, zeby "~/Library/Application Support/VoiceFlow" nie mial nic z
          # wczesniejszych krokow (Smoke test importuje moduly, ale nie odpala VoiceFlow).
          export HOME="$RUNNER_TEMP/voiceflow-launch-home"
          mkdir -p "$HOME"
          export QT_QPA_PLATFORM=offscreen
          OUT="$RUNNER_TEMP/launch-test-output.log"

          # `script` daje binarce pty, zeby uznala stderr za terminal i tam tez logowala
          # (core/logger.py loguje do stderr tylko, gdy sys.stderr.isatty()); w CI bez
          # tego nie byloby nic do wydrukowania poza plikiem logu.
          script -q "$OUT" "$BIN" &
          PID=$!

          sleep 20

          ALIVE=0
          kill -0 "$PID" 2>/dev/null && ALIVE=1 || true

          echo "--- stdout/stderr (przechwycone przez script, pty) ---"
          cat "$OUT" 2>/dev/null || echo "(brak pliku)"

          echo "--- voiceflow.log ---"
          LOGFILE="$HOME/Library/Application Support/VoiceFlow/voiceflow.log"
          if [ -f "$LOGFILE" ]; then
            cat "$LOGFILE"
          else
            echo "(brak pliku logu)"
          fi

          if [ "$ALIVE" -eq 1 ]; then
            # Pierwsze uruchomienie blokuje sie w exec() na oknie powitalnym albo na
            # prosbie o uprawnienia systemowe (Dostepnosc / Monitorowanie wprowadzania),
            # wiec "dalej dziala po 20s" jest tu wynikiem pozytywnym, nie zawieszeniem.
            echo "OK: aplikacja wciaz dziala po 20s (oczekiwany wynik pierwszego uruchomienia)."
            kill "$PID" 2>/dev/null || true
            pkill -f "Contents/MacOS/VoiceFlow" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          else
            set +e
            wait "$PID"
            EXIT_CODE=$?
            set -e
            echo "BLAD: aplikacja zakonczyla dzialanie sama w ciagu 20s (kod wyjscia: $EXIT_CODE)."
            echo "Na prawdziwym Macu tez by sie nie uruchomila."
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceFlow-macos-arm64
          path: dist/macos/VoiceFlow-macos-arm64.zip
          retention-days: 14
          if-no-files-found: error

      - name: Upload zip to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"

          # /release (Windows) tworzy release recznie i moze to zrobic PO wypchnieciu
          # taga, wiec czekamy az release sie pojawi zamiast od razu zakladac draft.
          FOUND=""
          for i in $(seq 1 20); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              FOUND="1"
              break
            fi
            echo "Release $TAG jeszcze nie istnieje (proba $i/20), czekam 30s..."
            sleep 30
          done

          if [[ -z "$FOUND" ]]; then
            echo "Release $TAG nie pojawil sie po ok. 10 minutach, tworze szkic (draft)."
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "$TAG" \
              --notes "Szkic release'u utworzony automatycznie przez build-macos.yml (Windows /release jeszcze nie utworzyl release'u dla tego taga)."
          fi

          gh release upload "$TAG" dist/macos/VoiceFlow-macos-arm64.zip \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
